[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
fs_permissions = [
    { access = "read", path = "./test/fixtures/propamm" },
    { access = "read-write", path = "./.earn" },
    { access = "read-write", path = "../profiles" },
    { access = "read-write", path = "../e2e/.local" },
    { access = "read-write", path = "../localnet/.local" },
]
# Compiled with solar (https://github.com/paradigmxyz/solar) at the revision solar.lock pins, through
# the solar-solc wrapper, which presents it to Forge as solc 0.8.36. Forge resolves this path from its
# working directory, so run it from earn/ or set FOUNDRY_SOLC to the wrapper's absolute path.
solc = "./solar-solc"
# Forge's cache does not record which compiler built an artifact, so solar output keeps its own
# cache; after bumping solar.lock, rebuild with --force.
cache_path = "cache/solar"
optimizer = true
optimizer_runs = 200
via_ir = true
# Tests compile for the EVM version deployments use.
evm_version = "cancun"
auto_detect_remappings = false
# Remappings feed every contract's metadata hash, so this list must stay byte-identical to the one
# that compiled the reviewed factory releases, including the entry for the removed upgradeable library.
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 32 }

[profile.audit]
fuzz = { runs = 10000 }
invariant = { runs = 512, depth = 128, fail_on_revert = false }

[profile.coverage]
cache_path = "cache/solar-coverage"
out = "out/coverage"
invariant = { runs = 64, depth = 32 }
# Coverage compiles with minimal IR optimization, under which this test's fuzz entrypoint is too
# deep for the stack; the router it exercises stays covered by the other router suites.
skip = ["SingleZoneEarnRouterAbiFuzz"]

[profile.coverage.coverage]
report = ["summary", "lcov"]
ir_minimum = true
exclude_tests = true

[profile.deploy]
cache_path = "cache/solar-deploy"
out = "out/deploy"

[lint]
# `forge lint` runs as its own step in `pnpm verify` and CI.
lint_on_build = false
# Every finding these produce on the audited contracts was triaged as a false positive or accepted:
# - block-timestamp, unsafe-typecast: timestamps gate oracle staleness, timelocks, and reward windows,
#   and `uint40(block.timestamp)` cannot truncate for tens of thousands of years.
# - reentrancy-no-eth, reentrancy-events, non-reentrant-not-first: writes and events after calls
#   run inside the reentrancy lock (including the lock's own exit write) against trusted callees,
#   and modifiers ahead of the lock are pure access checks.
# - uninitialized-local, unused-return: intended zero defaults, and balance deltas measured
#   instead of trusting venue return values.
# - incorrect-strict-equality: exactness checks against balances read in the same transaction.
# - calls-loop: batch loops call trusted engines and venues; a receiver hook can still spend most
#   of a batch's gas (see the failure modes in docs/earn/architecture/security-and-privacy.md).
# - missing-zero-check, missing-events-access-control, missing-events-arithmetic: zero checked in a
#   helper or deliberately disabling an optional role; events already emitted or demo-only; accrual
#   checkpoints are derived accounting state.
# - require-revert-in-loop: batch validation reverts atomically on purpose.
# - encode-packed-collision: standard CREATE2 init-code hashing.
# - arbitrary-send-erc20: only the vault calls it, with itself or its caller as `from`.
# Every other lint stays on, and `forge lint --deny warnings` fails on any new finding.
exclude_lints = [
    "arbitrary-send-erc20",
    "block-timestamp",
    "calls-loop",
    "encode-packed-collision",
    "incorrect-strict-equality",
    "missing-events-access-control",
    "missing-events-arithmetic",
    "missing-zero-check",
    "non-reentrant-not-first",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "uninitialized-local",
    "unsafe-typecast",
    "unused-return",
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
