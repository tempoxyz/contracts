name: Verify

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  # Earn and the Zone router: one Foundry project at the repository root. Spend tests need Tempo's
  # precompiles and run in spend.yml under the spend-ci profile.
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      # Depth 2 includes a pull request merge commit's base parent, so a later step can diff `src/`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          forge-cache: contracts

      - name: Check formatting
        run: forge fmt --check

      - name: Lint
        run: forge lint --deny warnings --out out/lint --cache-path cache/lint

      # The Zone router and spend sources keep their narrower lint exclusions (foundry.toml).
      - name: Lint Zone router and spend
        run: pnpm lint:zone-spend

      # One invocation for every source set: a partial build prunes the others from the cache.
      - name: Build
        run: forge build src script test

      - name: Check generated contract ABIs
        run: pnpm --filter @tempoxyz/contracts abis:check

      - name: Check deployable sizes
        run: FOUNDRY_PROFILE=deploy forge build --sizes src/earn/core/EarnVault.sol src/zone

      # The gas snapshot below runs the test/earn/gas and test/zone/gas benchmarks. A command-line --no-match-path
      # replaces foundry.toml's, so it repeats the default profile's exclusion of the spend tests.
      - name: Test
        run: forge test -vvv --no-match-path '{test/earn/gas/*,test/zone/gas/*,test/spend/**}'

      - name: Check gas snapshot
        run: pnpm gas:snapshot

      # `Test` already fuzzes the router callback ABI; a pull request that changes `src/` repeats it
      # over dirty memory before merge. Main does not, so production deploys never wait on it.
      - name: Detect contract source changes
        id: sources
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- src; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fuzz router callback ABI with brutalized memory
        if: steps.sources.outputs.changed == 'true'
        env:
          # --brutalize compiles from a temporary copy, where foundry.toml's relative path to the
          # compiler does not resolve.
          FOUNDRY_SOLC: ${{ github.workspace }}/solar-solc
        run: forge test --brutalize --match-contract SingleZoneEarnRouterAbiFuzzTest --fuzz-runs 4096 -vv

  # Rebuilds the committed DirectPropAMM and ManagedDirectPropAMM fixtures from their pinned public source,
  # tempoxyz/tempo-propamm, which it fetches without a token.
  propamm-fixture:
    name: PropAMM fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v1.8.6

      - name: Check the fixture matches the pinned build
        run: test/earn/fixtures/propamm/update.sh --check

      - name: Check the managed pool fixture matches the pinned build
        run: test/earn/fixtures/propamm/update.sh --check --source managed.source.json

  symbolic:
    name: Symbolic
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          forge-cache: symbolic
          node: 'false'

      # Ubuntu's z3 4.8 takes minutes on solar's output, which leaves small ABI arguments unmasked.
      - name: Install symbolic solver
        run: |
          python3 -m venv "$RUNNER_TEMP/z3"
          echo 'z3-solver==5.3.2.0 --hash=sha256:f17df07300228a383470d4b4e1ad9daf429dc94885996712a1844a8242803935' \
            > "$RUNNER_TEMP/z3.txt"
          "$RUNNER_TEMP/z3/bin/pip" install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/z3.txt"
          echo "$RUNNER_TEMP/z3/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/z3/bin/z3" --version

      # Include compiler-generated ABI and memory initialization loops in the proof bound.
      - name: Prove fee arithmetic and conversion properties
        run: >-
          forge test --symbolic --match-contract EarnFeeMathFuzzTest --match-test '^prove'
          --symbolic-solver z3 --symbolic-timeout 60 --symbolic-loop 32 -vv

  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Check formatting and lint
        run: pnpm check

      # Sequential on the 4-vCPU runner: the parallel local `pnpm check:types` took about 150s here,
      # against 70-100s one workspace at a time.
      - name: Typecheck
        run: pnpm -r --workspace-concurrency=1 run '/^(typecheck|check:types)$/'

  javascript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Test deployments, E2E, and localnet units
        run: pnpm test
