name: Verify

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        # Earn's Foundry project; composite actions still run from the repository root.
        working-directory: earn
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      # Depth 2 includes a pull request merge commit's base parent, so a later step can diff `earn/src/`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          forge-cache: contracts

      - name: Check formatting
        run: forge fmt --check

      - name: Lint
        run: forge lint --deny warnings --out out/lint --cache-path cache/lint

      # One invocation for every source set: a partial build prunes the others from the cache.
      - name: Build
        run: forge build src script test

      - name: Check generated contract ABIs
        run: pnpm --filter @tempoxyz/earn abis:check

      - name: Check EarnVault deployable size
        run: FOUNDRY_PROFILE=deploy forge build --sizes src/core/EarnVault.sol

      # The gas snapshot below runs the test/gas benchmarks.
      - name: Test
        run: forge test -vvv --no-match-path 'test/gas/*'

      - name: Check gas snapshot
        run: pnpm gas:snapshot

      # `Test` already fuzzes the router callback ABI; a pull request that changes `src/` repeats it
      # over dirty memory before merge. Main does not, so production deploys never wait on it.
      - name: Detect contract source changes
        id: sources
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- src; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fuzz router callback ABI with brutalized memory
        if: steps.sources.outputs.changed == 'true'
        env:
          # --brutalize compiles from a temporary copy, where foundry.toml's relative path to Earn's
          # compiler does not resolve.
          FOUNDRY_SOLC: ${{ github.workspace }}/earn/solar-solc
        run: forge test --brutalize --match-contract SingleZoneEarnRouterAbiFuzzTest --fuzz-runs 4096 -vv

  # Rebuilds the committed DirectPropAMM fixture from its pinned private source. Forks cannot read
  # tempoxyz/propAMM: a fork PR that leaves the fixture unchanged passes without the rebuild, and one
  # that changes it fails until a maintainer re-verifies it from a branch in this repository.
  propamm-fixture:
    name: PropAMM fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gate fork pull requests
        id: fork
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$FORK" != true ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$(git diff --name-only "$BASE_SHA" HEAD -- earn/test/fixtures/propamm)" ]]; then
            echo "::error::A fork cannot rebuild the private PropAMM source, so this change to earn/test/fixtures/propamm/ is unverified. A maintainer must re-verify it from a branch in this repository."
            exit 1
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - if: steps.fork.outputs.skip != 'true'
        uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v1.8.6

      - name: Read pinned PropAMM commit
        id: source
        if: steps.fork.outputs.skip != 'true'
        run: |
          set -euo pipefail
          commit=$(jq -er .commit earn/test/fixtures/propamm/source.json)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Authorize PropAMM checkout
        id: sts
        if: steps.fork.outputs.skip != 'true'
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          scope: tempoxyz/propAMM
          policy: earn-ci-read
          ttl: 5m

      - name: Checkout pinned PropAMM
        if: steps.fork.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/propAMM
          ref: ${{ steps.source.outputs.commit }}
          path: .propamm
          token: ${{ steps.sts.outputs.token }}
          persist-credentials: false

      - name: Check the fixture matches the pinned build
        if: steps.fork.outputs.skip != 'true'
        run: earn/test/fixtures/propamm/update.sh --check .propamm

  symbolic:
    name: Symbolic
    runs-on: ubuntu-latest
    defaults:
      run:
        # Earn's Foundry project; composite actions still run from the repository root.
        working-directory: earn
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          forge-cache: symbolic
          node: 'false'

      # Ubuntu's z3 4.8 takes minutes on solar's output, which leaves small ABI arguments unmasked.
      - name: Install symbolic solver
        run: |
          python3 -m venv "$RUNNER_TEMP/z3"
          "$RUNNER_TEMP/z3/bin/pip" install z3-solver==5.3.2.0
          echo "$RUNNER_TEMP/z3/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/z3/bin/z3" --version

      # Include compiler-generated ABI and memory initialization loops in the proof bound.
      - name: Prove fee arithmetic and conversion properties
        run: >-
          forge test --symbolic --match-contract EarnFeeMathFuzzTest --match-test '^prove'
          --symbolic-solver z3 --symbolic-timeout 60 --symbolic-loop 32 -vv

  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Check formatting and lint
        run: pnpm check

      # Sequential on the 4-vCPU runner: the parallel local `pnpm check:types` took about 150s here,
      # against 70-100s one workspace at a time.
      - name: Typecheck
        run: pnpm -r --workspace-concurrency=1 run '/^(typecheck|check:types)$/'

  # Split from the checks above, which it used to follow in one ~240s job, the PR's longest.
  build:
    name: Build app and Worker
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build app and Worker
        run: pnpm build

  javascript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Test app, Worker, deployments, E2E, and localnet units
        run: pnpm test
