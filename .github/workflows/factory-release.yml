name: Factory Release

# Deploys the shared factory releases from main on the hosted networks and source verifies them on
# Tempo's verifier, then pushes a branch that records the verified releases in
# deployments/core/releases.ts, for a maintainer to open as a pull request.
on:
  workflow_dispatch:
    inputs:
      networks:
        description: Hosted networks; both runs Moderato first, and mainnet only after it succeeds
        required: true
        type: choice
        # The factory release unit test asserts these lists match the hosted networks and releases.
        options: [both, moderato, mainnet]
      release:
        description: Releases to deploy; all is the core release (EarnVault, EarnFees, EarnFactory) and every engine factory
        required: true
        type: choice
        options: [all, core, rewards, erc4626Engine]
      broadcast:
        description: Broadcast, source verify, and push the registry branch; unchecked only simulates
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    name: ${{ inputs.release }} on ${{ matrix.network }}${{ inputs.broadcast && ' (broadcast)' || ' (dry run)' }}
    if: github.ref == 'refs/heads/main'
    strategy:
      # One network at a time, in order; a failure stops the networks after it.
      max-parallel: 1
      fail-fast: true
      matrix:
        network: ${{ fromJSON(inputs.networks == 'both' && '["moderato","mainnet"]' || format('["{0}"]', inputs.networks)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Dispatching from main is the approval: the environment has no required reviewer, accepts only
    # main, and holds the deployer key, the same key local profile deployments use.
    environment: factory-release-${{ matrix.network }}
    # Shares the network's hosted-contracts queue. It orders only CI jobs, so do not broadcast with the
    # deployer key locally while a release runs.
    concurrency:
      group: hosted-contracts-${{ matrix.network }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          forge-cache: factory-release
          workspace: '@tempoxyz/earn'

      - name: Deploy and verify
        env:
          NETWORK: ${{ matrix.network }}
          RELEASE: ${{ inputs.release }}
          BROADCAST: ${{ inputs.broadcast }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          TEMPO_RPC_URL: ${{ secrets.TEMPO_RPC_URL }}
          TEMPO_RPC_USERNAME: ${{ secrets.TEMPO_RPC_USERNAME }}
          TEMPO_RPC_PASSWORD: ${{ secrets.TEMPO_RPC_PASSWORD }}
        run: |
          set -euo pipefail
          arguments=("$NETWORK" "$RELEASE" --output "$RUNNER_TEMP/factory-release.json")
          if [[ "$BROADCAST" == 'true' ]]; then arguments+=(--broadcast); fi
          pnpm factory-release "${arguments[@]}"

      # Forge records the authenticated RPC URL in its script sequences under earn/cache, which the
      # forge cache saves after the job for every branch to restore; the command deletes them, and
      # this removes any it could not, whatever the outcome, before that save.
      - name: Remove Forge script sequences
        if: ${{ always() }}
        run: find earn/cache -mindepth 2 -maxdepth 2 -type d -name '*.s.sol' -exec rm -rf {} +

      - name: Summarize
        if: ${{ always() }}
        env:
          NETWORK: ${{ matrix.network }}
        run: |
          result="$RUNNER_TEMP/factory-release.json"
          if [[ ! -f "$result" ]]; then
            echo "No release ran on ${NETWORK}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Factory releases on ${NETWORK} · $(jq -r 'if .broadcast then "broadcast" else "dry run" end' "$result") · ${GITHUB_SHA::7}"
            echo
            echo '| Release | Contract | Address | Transaction | Source match |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r '.releases[] | .kind as $kind | .contracts[] | "| \($kind) | \(.name) | `\(.address)` | \(if .transaction then "`\(.transaction)`" else "already deployed" end) | \(.match // (if .verificationError then "not verified: \(.verificationError)" else "-" end)) |"' "$result"
            if jq -e '.failed' "$result" >/dev/null; then
              echo
              echo "Stopped at the $(jq -r '.failed.kind' "$result") release; the releases above it are deployed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          # One artifact per attempt, so a rerun that gets less far keeps what an earlier attempt verified.
          name: factory-release-${{ matrix.network }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/factory-release.json
            earn/broadcast/
          if-no-files-found: ignore

  # Records every broadcast release whose contracts all source verified, including those from a
  # network that later failed, on a branch; the registry changes only through a reviewed pull request.
  registry:
    name: Push the registry branch
    needs: release
    if: ${{ always() && inputs.broadcast && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          workspace: '@tempoxyz/earn'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-release-*
          path: ${{ runner.temp }}/releases

      - name: Record the verified releases
        id: registry
        run: |
          set -euo pipefail
          # Attempt order (version sort), so a later attempt's entry for the same release wins.
          mapfile -t results < <(find "$RUNNER_TEMP/releases" -name factory-release.json | sort -V)
          if [[ ${#results[@]} -eq 0 ]]; then
            echo 'No release produced a result.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm factory-release registry "${results[@]}" --body "$RUNNER_TEMP/registry-pr.md"
          if git diff --quiet -- deployments/core/releases.ts; then
            echo 'No verified release to record.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Push the branch
        if: ${{ steps.registry.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One branch per attempt: a rerun of failed jobs pushes its own branch instead of being refused
          # by the first attempt's.
          branch="factory-release/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$branch"
          git commit --message "feat(deployments): record the factory releases from run ${GITHUB_RUN_ID}" -- deployments/core/releases.ts
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          {
            echo "Pushed \`$branch\` with the verified releases in releases.ts."
            echo "[Open its pull request](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1) with this description:"
            echo
            cat "$RUNNER_TEMP/registry-pr.md"
          } >> "$GITHUB_STEP_SUMMARY"
