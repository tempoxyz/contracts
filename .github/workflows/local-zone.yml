name: Local E2E

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Main does not rerun E2E; it only refreshes the Forge caches pull requests restore.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job selects its own scope, so an out-of-scope change still reports every required check.
  test-shard:
    name: Test (${{ matrix.variant }}, shard ${{ matrix.shard }})
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        # Every engine kind; the local E2E CI unit test asserts this list matches the registry.
        variant: [erc4626, veda, propamm]
        shard: [1/2, 2/2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    env:
      # Runners are discarded after the job, so the reaper sidecar (pulled from Docker Hub) is unneeded.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Local E2E scope
        id: scope
        uses: ./.github/actions/e2e-scope

      # The download overlaps the rest of setup; the environment boot reuses the pulled layers.
      - name: Start pulling the pinned Tempo and Zone images
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          jq -r '.l1Image, .zoneImage' localnet/fixtures/runtime-lock.json |
            nohup xargs -n 1 -P 2 docker pull --quiet > "$RUNNER_TEMP/image-pull.log" 2>&1 &

      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: ./.github/actions/setup
        with:
          forge-cache: localnet
          workspace: e2e

      - name: Run shared E2E cases on Prool
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: pnpm e2e:local -- --variant ${{ matrix.variant }} --all --shard ${{ matrix.shard }}

  warm-cache:
    name: Warm Forge cache
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Local E2E scope
        id: scope
        uses: ./.github/actions/e2e-scope

      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: ./.github/actions/setup
        with:
          forge-cache: localnet
          node: 'false'

      # Localnet compiles under the deploy profile (deployments/chain/foundry.ts), so the saved
      # cache matches what E2E restores. One invocation for every source set E2E compiles, without
      # tests: a partial build prunes the others from the cache.
      - name: Build the deploy profile
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: earn
        env:
          FOUNDRY_PROFILE: deploy
        run: forge build src script

  test:
    name: Required / Local E2E
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: test-shard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Require every Local E2E shard to pass
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: test "$SHARD_RESULT" = success
