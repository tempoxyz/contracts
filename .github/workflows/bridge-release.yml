name: Bridge Release

# Deploys the card integration's ownerless contracts for a SpenderFactory from main: the "TS" handler
# (SpenderTempoSpend), or a Bridge card program's CardProgram, with the release CardFactory and the
# program's BridgeIssuer it needs. The handler, factory and issuer land at their deterministic release
# addresses (the CREATE2 deployer with Earn's release salt) and the factory creates the program at the
# address its spender ID, issuer and guardian fix: the same addresses the issuer reaches running the
# deploy scripts itself. Any already there is reused. After a broadcast each is source verified on
# Tempo's verifier. Registering the handler stays with the issuer's admin and governance, so the job
# summary lists the calls each submits; nothing here holds a role on the factory. Listing the program
# in a Spend-mode router is a Zone Router Release (zone-router-release.yml).
on:
  workflow_dispatch:
    inputs:
      network:
        description: Hosted network
        required: true
        type: choice
        options: [moderato, mainnet]
      contract:
        description: tempoSpend is the "TS" handler; bridgeProgram is a card program's CardProgram
        required: true
        type: choice
        options: [tempoSpend, bridgeProgram]
      factory:
        description: The SpenderFactory address
        required: true
        type: string
      spenderId:
        description: bridgeProgram only, the card program's spender ID (bytes32)
        required: false
        type: string
        default: ''
      guardian:
        description: bridgeProgram only, the account that can pause the program; empty for none
        required: false
        type: string
        default: ''
      broadcast:
        description: Broadcast and source verify; unchecked only simulates
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    name: ${{ inputs.contract }} on ${{ inputs.network }}${{ inputs.broadcast && ' (broadcast)' || ' (dry run)' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dispatching from main is the approval: the environment has no required reviewer, accepts only
    # main, and holds the deployer key the factory releases use. The contracts
    # are ownerless, so the key only pays fees.
    environment: factory-release-${{ inputs.network }}
    # Shares the network's hosted-contracts queue with the factory releases, so the deployer key never
    # sends from two CI jobs at once.
    concurrency:
      group: hosted-contracts-${{ inputs.network }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: cards
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CardProgram imports the settler interface from zone-router/src/ and Earn's from earn/src/, which need
      # no dependency of their own.
      - name: Install the card integration's Solidity dependencies
        working-directory: .
        run: scripts/solidity-deps.sh cards

      - uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v1.8.6

      # Inputs reach the script only through the environment; release.sh validates them.
      - name: Deploy and verify
        env:
          NETWORK: ${{ inputs.network }}
          CONTRACT: ${{ inputs.contract }}
          FACTORY: ${{ inputs.factory }}
          SPENDER_ID: ${{ inputs.spenderId }}
          GUARDIAN: ${{ inputs.guardian }}
          BROADCAST: ${{ inputs.broadcast }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          TEMPO_RPC_URL: ${{ secrets.TEMPO_RPC_URL }}
          TEMPO_RPC_USERNAME: ${{ secrets.TEMPO_RPC_USERNAME }}
          TEMPO_RPC_PASSWORD: ${{ secrets.TEMPO_RPC_PASSWORD }}
        run: |
          set -euo pipefail
          # An empty guardian is none: release.sh reads an unset GUARDIAN as zero.
          if [[ -z "$GUARDIAN" ]]; then unset GUARDIAN; fi
          arguments=("$NETWORK" "$CONTRACT")
          if [[ "$BROADCAST" == 'true' ]]; then arguments+=(--broadcast); fi
          RESULT="$RUNNER_TEMP/bridge-release.json" script/bridge/deploy/release.sh "${arguments[@]}"

      # Forge records the authenticated RPC URL in its script sequences under cards/cache; the script
      # deletes them, and this removes any it could not, whatever the outcome.
      - name: Remove Forge script sequences
        if: ${{ always() }}
        run: find cache -mindepth 1 -maxdepth 2 -type d -name '*.s.sol' -exec rm -rf {} +

      - name: Summarize
        if: ${{ always() }}
        env:
          NETWORK: ${{ inputs.network }}
        run: |
          result="$RUNNER_TEMP/bridge-release.json"
          if [[ ! -f "$result" ]]; then
            echo "No release ran on ${NETWORK}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Bridge release on ${NETWORK} · $(jq -r 'if .broadcast then "broadcast" else "dry run" end' "$result") · ${GITHUB_SHA::7}"
            echo
            echo '| Contract | Address | Transaction | Source match |'
            echo '| --- | --- | --- | --- |'
            jq -r '.broadcast as $broadcast | .contracts[]? | "| \(.name) | `\(.address)` | \(if .transaction then "`\(.transaction)`" elif .existed then "already deployed" elif $broadcast then "-" else "would be created" end) | \(.match // "-") |"' "$result"
            jq -r 'select(.factory) | "\nFactory `\(.factory)`."' "$result"
            jq -r 'select(.spenderId) | "\nCard program `\(.spenderId)`, guardian `\(.guardian)`."' "$result"
            if jq -e '.contract == "tempoSpend" and .output.adminRegisterHandler' "$result" >/dev/null; then
              echo
              echo '### Calls for Bridge to submit'
              echo
              jq -r 'if .output.registered then "The factory already runs this handler, so the admin call changes nothing.\n" else empty end' "$result"
              echo '| Submitted by | Call | Calldata |'
              echo '| --- | --- | --- |'
              jq -r '"| Admin (timelock) | `setSpenderHandler(\"TS\", handler)` | `\(.output.adminRegisterHandler)` |"' "$result"
              jq -r '.output | if (.governanceGateHandler // "0x") != "0x" then "| Governance | `updateSpenderHandlerStatus(\"TS\", Gated)` | `\(.governanceGateHandler)` |" else empty end' "$result"
              jq -r '.output | if .status then "\nThe prefix was `\(.status)` before this deploy; docs/cards/bridge/deploy.md says when governance gates it." else "\nA broadcast also writes the governance gate call when the factory needs one." end' "$result"
            fi
            if jq -e '.error' "$result" >/dev/null; then
              echo
              echo "Failed: $(jq -r '.error' "$result")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          # One artifact per attempt, so a rerun keeps what an earlier attempt recorded.
          name: bridge-release-${{ inputs.network }}-${{ inputs.contract }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bridge-release.json
            cards/broadcast/
          if-no-files-found: ignore
