name: Spend

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Card spend on Tempo: the provider-agnostic contracts (src/spend/) and each provider's (Bridge, Rain),
# which import Earn and the Zone router from the same Foundry project. Its tests and scripts need
# Tempo's precompiles, so they run under the spend profiles (hardfork tempo:T8); Verify owns the
# project's format, lint, and build. The jobs run only when the contracts, the spend scripts, tests,
# vendored code or docs, e2e/spend/, localnet/ (with its pinned images) or the shared build
# configuration change; Required / Spend reports on every pull request, passing when out of scope.
jobs:
  scope:
    name: Select Spend scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      # A pull request or push runs the jobs only when it changes one of these paths; any other event
      # (or a branch-creating push) always runs them.
      - id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let files
            if (context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              })
            } else if (context.eventName === 'push' && !/^0+$/.test(context.payload.before)) {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${context.payload.before}...${context.payload.after}`,
              })
              // The comparison lists at most 300 files; treat a larger push as in scope.
              files = data.files?.length < 300 ? data.files : undefined
            }
            if (!files) {
              core.info(`Spend is required for ${context.eventName}`)
              core.setOutput('run', 'true')
              return
            }

            const exactPaths = new Set([
              '.github/workflows/spend.yml',
              'e2e/package.json',
              'foundry.lock',
              'foundry.toml',
              'package.json',
              'pnpm-lock.yaml',
              'script/DeterministicRelease.sol',
              'scripts/solidity-deps.sh',
              'solar-releases.json',
              'solar-solc',
              'solar.lock',
            ])
            const pathPrefixes = [
              '.github/actions/setup/',
              '.github/actions/solar-cache/',
              'docs/spend/',
              'e2e/harness/',
              'e2e/spend/',
              'localnet/',
              'script/spend/',
              'snapshots/',
              'src/',
              'test/spend/',
              'vendor/',
            ]
            // A rename lists its old path in `previous_filename`; moving a file out of scope still counts.
            const inScope = (path) =>
              exactPaths.has(path) || pathPrefixes.some((prefix) => path.startsWith(prefix))
            const run = files.some(
              ({ filename, previous_filename }) =>
                inScope(filename) || (previous_filename !== undefined && inScope(previous_filename)),
            )

            core.info(`Spend ${run ? 'is required' : 'is not required'} for this change`)
            core.setOutput('run', run ? 'true' : 'false')

  test:
    name: Test
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required by tempoxyz/gh-actions secure-runner.
      id-token: write
    env:
      FOUNDRY_PROFILE: spend
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/solar-cache

      - name: Install Solidity dependencies
        run: scripts/solidity-deps.sh

      - uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v1.8.6

      - name: Contract sizes
        run: forge build --sizes src/spend

      # The committed Rain bytecode is what vendor/rain builds to with Rain's own compiler settings,
      # apart from the metadata hashes, which name each checkout's absolute paths.
      - name: Rain fixture is current
        run: script/spend/rain/build-fixture.sh --check

      - name: Test
        env:
          FOUNDRY_PROFILE: spend-ci
        run: forge test

      - name: Bridge matrix is current
        run: |
          python3 script/spend/bridge/matrix.py --out reports/matrix.md
          diff -u docs/spend/bridge/matrix.md reports/matrix.md

  # Public and private card spend end to end, from pathUSD and from Earn shares, with Rain as the
  # provider, on a disposable Tempo L1 and Zone started by the shared localnet.
  e2e:
    name: Rain E2E
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # Runners are discarded after the job, so the testcontainers reaper is unneeded.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/solar-cache

      - name: Install Solidity dependencies
        run: scripts/solidity-deps.sh

      - uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v1.8.6

      - uses: ./.github/actions/setup
        with:
          workspace: e2e

      - name: Build contracts
        env:
          FOUNDRY_PROFILE: spend
        run: forge build

      - name: Run
        run: pnpm e2e:cards -- --provider rain --earn

  # A private spend end to end, from pathUSD and from Earn shares, on a disposable Tempo L1 and Zone
  # started by the shared localnet, from the images localnet/fixtures/runtime-lock.json pins.
  bridge-zone-e2e:
    name: Bridge Zone E2E
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # Runners are discarded after the job, so the testcontainers reaper is unneeded.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/solar-cache

      - name: Install Solidity dependencies
        run: scripts/solidity-deps.sh

      - uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v1.8.6

      - uses: ./.github/actions/setup
        with:
          workspace: e2e

      - name: Build contracts
        env:
          FOUNDRY_PROFILE: spend
        run: forge build

      # --earn also deploys Tempo Earn's e2e-moderato stack locally, so the Earn spend steps run.
      - name: Run
        run: pnpm e2e:bridge -- --earn

  # Public pulls and Bridge's access key on a disposable Tempo dev node. The script selects the spend
  # profile itself.
  bridge-smoke:
    name: Bridge smoke
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/solar-cache

      - name: Install Solidity dependencies
        run: scripts/solidity-deps.sh

      - uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v1.8.6

      - name: Bridge smoke
        run: bash script/spend/bridge/smoke.sh

  required:
    name: Required / Spend
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [scope, test, e2e, bridge-zone-e2e, bridge-smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      # Out of scope, the jobs are skipped and this passes; in scope, every job must pass.
      - name: Require every Spend job to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          RESULTS: ${{ needs.test.result }} ${{ needs.e2e.result }} ${{ needs.bridge-zone-e2e.result }} ${{ needs.bridge-smoke.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          if [[ "$RUN" != 'true' ]]; then
            echo 'Spend is not required for this change'
            exit 0
          fi
          for result in $RESULTS; do test "$result" = success; done
