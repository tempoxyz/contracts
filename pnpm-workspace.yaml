packages:
  - deployments
  - e2e
  - localnet

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: false

catalog:
  '@types/node': ^26.6.5
  tsx: ^4.23.15
  typescript: 7.0.2
  viem: ^2.57.14
  vitest: ^5.0.5
  vp: npm:vite-plus@~1.3.0

# Require releases to be at least one day old for manual resolutions.
fetchFullMetadata: true
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false

minimumReleaseAgeExclude:
  - '@voidzero-dev/*'
  - vite-plus
  # Security backport for the bundled launch-editor advisories.
  - vite@8.1.6
  # Security fixes for Undici redirect and proxy handling.
  - undici@8.12.2

trustPolicy: no-downgrade

overrides:
  # Vite bundles launch-editor; override the affected bundle, not launch-editor itself.
  'vite@>=8.0.0 <8.1.6': 8.1.6
  'undici@>=8.0.0 <8.12.2': 8.12.2
  # Prool still pins tar 7.2.0; remove when upstream upgrades.
  'prool>tar': 7.5.22
  viem: 'catalog:'

shellEmulator: true
